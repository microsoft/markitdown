[package]
name = "markitdown-desktop"
version = "0.1.0"
description = "Lightweight desktop UI for MarkItDown."
authors = ["MarkItDown contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "markitdown_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markitdown-core = { path = "../../crates/markitdown-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
