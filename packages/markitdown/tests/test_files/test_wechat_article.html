<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>示例微信文章</title>
  <meta property="og:title" content="示例微信文章">
  <meta property="og:image" content="https://example.com/cover.jpg">
</head>
<body class="zh_CN mm_appmsg">
  <div id="js_article" class="rich_media">
    <div id="img-content" class="rich_media_wrp">
      <h1 id="activity-name" class="rich_media_title">示例微信文章</h1>
      <div id="meta_content" class="rich_media_meta_list">
        <span id="js_author_name">作者甲</span>
        <a id="js_name">示例公众号</a>
        <em id="publish_time">2026-05-25</em>
      </div>
      <div id="js_novel_card" class="novel-card">在小说阅读器读本章 去阅读</div>
      <div id="js_content" class="rich_media_content">
        <section>
          <p>这是第一段正文，应当保留。</p>
          <p><img data-src="https://example.com/article-image.jpg" alt="配图"></p>
          <p>这是第二段正文，也应当保留。</p>
        </section>
        <section>
          <p>因微信平台规则调整，建议您将本公众号设为星标，以便及时获取更新内容。</p>
        </section>
        <section>
          <p>点击下方“阅读原文”，查看详情</p>
        </section>
        <section>
          <p><strong>相关阅读</strong></p>
          <p><a href="https://mp.weixin.qq.com/s/example">另一篇微信文章</a></p>
        </section>
      </div>
    </div>
    <div id="js_pc_qr_code" class="qr_code_pc_outer">微信扫一扫 关注该公众号</div>
    <div id="wx_stream_article_slide_tip" class="wx_stream_article_slide_tip">继续滑动看下一个</div>
    <div id="js_minipro_dialog" class="outer_dialog">取消 允许</div>
    <span id="js_a11y_zan_btn_txt">赞</span>
    <span id="js_a11y_comment_btn_txt">留言</span>
    <span id="js_a11y_collect_btn_txt">收藏</span>
  </div>
</body>
</html>
