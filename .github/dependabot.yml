version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directories:
      - "/packages/markitdown"
      - "/packages/markitdown-mcp"
      - "/packages/markitdown-ocr"
      - "/packages/markitdown-sample-plugin"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
