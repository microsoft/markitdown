# CI for the Rust MarkItDown suite under app/ (core lib, CLI, MCP, Tauri desktop).
# Runs on every PR / push that touches app/. Fast feedback: tests + a debug
# build + a headless smoke test. The heavyweight installer build lives in
# app-release.yml.
#
# Context-awareness / GitHub-runner limitations baked in:
#   * No display server  -> we never launch the Tauri GUI; we only compile it
#                           and run its command-layer unit tests.
#   * No network reliance -> every test is offline (LLM caption uses a local
#                           mock server, web converters use local fixtures).
#   * No Python engine    -> the python-engine fallback is opt-in; the
#                           python_fallback.rs suite is `#![cfg(unix)]` and uses
#                           shell stubs, so it compiles away on Windows and never
#                           needs a real PyInstaller binary.
name: app-ci

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]

# Cancel superseded runs on the same ref.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A representative subset: Linux (x86_64) + Windows (validates the
        # cfg(unix) gating) + macOS Apple Silicon. The full 5-platform matrix
        # is exercised at release time.
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-14
            label: macos-aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            app/desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      # ---- tests ----------------------------------------------------------
      - name: Test core / CLI / MCP workspace
        working-directory: app
        run: cargo test --workspace --locked

      - name: Test desktop backend (command layer)
        working-directory: app/desktop/src-tauri
        run: cargo test --locked

      - name: Frontend typecheck + build
        working-directory: app/desktop
        run: |
          npm ci
          npm run build

      # ---- debug build + headless smoke test ------------------------------
      - name: Build CLI + MCP (debug)
        working-directory: app
        run: cargo build --locked -p markitdown-cli -p markitdown-mcp

      - name: Smoke test the binaries
        run: |
          set -euo pipefail
          EXE=""; [[ "$RUNNER_OS" == "Windows" ]] && EXE=".exe"
          BIN="app/target/debug"
          "$BIN/markitdown$EXE" --version
          "$BIN/markitdown$EXE" --list-formats | grep -qi PDF
          "$BIN/markitdown$EXE" packages/markitdown/tests/test_files/test.docx | grep -q AutoGen
          # MCP stdio handshake (capture to file so a downstream grep can't
          # SIGPIPE the server before it flushes).
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            > mcp_req.txt
          "$BIN/markitdown-mcp$EXE" < mcp_req.txt > mcp_resp.txt
          grep -q convert_to_markdown mcp_resp.txt
          echo "smoke OK on ${{ matrix.label }}"
